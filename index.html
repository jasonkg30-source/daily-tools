<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Tools — one small useful tool a day</title>
<meta name="description" content="One focused tool per day, each built for a real question people are searching for. No accounts, no clutter.">
<link rel="canonical" href="https://jasonkg30-source.github.io/daily-tools/">
<style>
  :root{--ink:#12100e;--muted:#5f5a55;--line:#e3ded7;--bg:#fbf9f6;--accent:#1f5f4a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:760px;margin:0 auto;padding:48px 20px 72px}
  h1{font-size:clamp(28px,5vw,40px);line-height:1.15;letter-spacing:-.025em;margin:0 0 10px}
  .lede{color:var(--muted);font-size:17px;margin:0 0 34px;max-width:56ch}
  ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid var(--line)}
  a.item{display:flex;gap:14px;justify-content:space-between;align-items:baseline;padding:16px 4px;text-decoration:none;color:inherit}
  a.item:hover{background:#f5f1eb}
  .name{font-weight:620;letter-spacing:-.01em}
  .desc{display:block;color:var(--muted);font-size:14px;font-weight:400;margin-top:3px}
  .date{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
  footer{margin-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Daily Tools</h1>
  <p class="lede">One small, honest tool per day. Each one answers a question people actually type into a search box — no sign-up, no paywall, no clutter.</p>
  <ul id="list"></ul>
  <footer>Built automatically. Estimates are educational, not professional advice.</footer>
</main>
<script>
const tools = [
  {
    slug: "tools/student-loan-extra-payment/",
    name: 'Student Loan Extra Payment Calculator',
    desc: 'See how many months earlier you pay off a student loan and how much interest you skip with an extra monthly amount.',
    date: "2026-11-10"
  },
  {
    slug: "tools/roth-vs-traditional/",
    name: "Roth vs Traditional 401(k) calculator",
    desc: "Compare the two accounts after tax, not before — the number that actually matters.",
    date: "2026-11-09"
  }
];
document.getElementById("list").innerHTML = tools
  .sort((a, b) => b.date.localeCompare(a.date))
  .map(t => `<li><a class="item" href="${t.slug}">
      <span><span class="name">${t.name}</span><span class="desc">${t.desc}</span></span>
      <span class="date">${t.date}</span></a></li>`).join("");
</script>
</body>
</html>
